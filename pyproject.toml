[project]
name = "pulsar-dispatcher"
description = "Task dispatcher using Apache Pulsar with prioritisation and timed retries"
authors = [
    {name = "Mark Parncutt", email = "me@markparncutt.com"},
]
dynamic = ["version"]
dependencies = [
    "pulsar-client>=3.9.0"
]
requires-python = ">=3.10,<3.15"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "apache-pulsar",
    "asyncio",
    "dead-letter-queue",
    "dispatcher",
    "message-queue",
    "priority",
    "pulsar",
    "retry",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/U-238/pulsar-dispatcher"

[build-system]
# 2.4 added SPDX license expressions and license-files (PEP 639).
requires = ["pdm-backend>=2.4"]
build-backend = "pdm.backend"

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
lint = [
    "ruff>=0.17.0",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.format]
# README snippets are illustrative, not runnable modules.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["pulsar_dispatcher"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["pulsar", "pulsar.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not integration' --cov=pulsar_dispatcher --cov-report=term-missing"
filterwarnings = ["error"]
markers = [
    "integration: needs a Pulsar broker at PULSAR_URL (default pulsar://localhost:6650)",
]

[tool.pdm.version]
source = "scm"
write_to = "pulsar_dispatcher/version.py"
write_template = "# Dynamically generated by build system, do not modify.\n__version__ = version = \"{}\"\n"

[tool.pdm.build]
excludes = ["./**/.git"]
package-dir = "src"

[tool.pdm.scripts]
lint = { composite = ["ruff check .", "ruff format --check .", "mypy"] }
# --exit-zero so formatting still runs when unfixable issues remain.
fmt = { composite = ["ruff check --fix --exit-zero .", "ruff format ."] }
test = "pytest"
test-integration = "pytest -m integration --no-cov"
